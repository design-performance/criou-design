name: Publicar site (Cloudflare)

# Sempre que o site (pasta public/) ou a configuração mudam no GitHub,
# este robô publica a versão nova no Worker "design-por-pergunta" da Cloudflare.
# A chave fica guardada em Settings > Secrets and variables > Actions > CLOUDFLARE_API_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar na Cloudflare
        env:
          CHAVE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5dfafa477cb2604db1931690e3302ed6
        run: |
          if [ -z "$CHAVE" ]; then echo "Falta a chave CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions."; exit 1; fi
          # Aceita a chave pura ou colada junto com texto em volta (ex: "Bearer xxxxx").
          T=$(printf '%s' "$CHAVE" | grep -oE '(Bearer[[:space:]]+|TOKEN=)[A-Za-z0-9_-]{20,}' | grep -oE '[A-Za-z0-9_-]{20,}$' | head -1 || true)
          if [ -z "$T" ]; then T=$(printf '%s' "$CHAVE" | grep -oE '[A-Za-z0-9_-]{30,}' | head -1 || true); fi
          export CLOUDFLARE_API_TOKEN="$T"
          npx --yes wrangler@4.162.0 deploy || { echo "--- detalhes do erro ---"; tail -n 40 ~/.config/.wrangler/logs/*.log | grep -vi "token\|authorization"; exit 1; }
